<style>:root {
  --font-display: "Michroma", sans-serif;
  --font-body: "Manrope", sans-serif;
  --radius: .5rem;
  --background: oklch(14% .005 260);
  --foreground: oklch(96% .01 90);
  --card: oklch(19% .006 260);
  --card-foreground: var(--foreground);
  --popover: var(--card);
  --popover-foreground: var(--foreground);
  --primary: oklch(80% .14 85);
  --primary-foreground: oklch(15% .01 260);
  --secondary: oklch(25% .008 260);
  --secondary-foreground: var(--foreground);
  --muted: oklch(23% .007 260);
  --muted-foreground: oklch(68% .015 90);
  --accent: var(--secondary);
  --accent-foreground: var(--foreground);
  --destructive: oklch(57.7% .245 27.325);
  --destructive-foreground: var(--foreground);
  --border: oklch(30% .01 260);
  --input: var(--border);
  --ring: var(--primary);
  --product-highlight-shadow: 0 8px 24px oklch(0% 0 0 / 35%);
  --mercadolivre: oklch(91.7% .1915 101.41);
  --mercadolivre-foreground: oklch(35.5% .1163 275.63);
  --shopee: oklch(64.2% .2027 33.14);
  --shopee-foreground: oklch(100% 0 0);
}

*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground)}
h1,h2,h3,p{margin:0}a{text-decoration:none}button,a{font:inherit}button{color:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:8px 14px;border:0;border-radius:6px;font-size:13px;font-weight:600;background:var(--primary);color:var(--primary-foreground)}
.outline{background:transparent;border:1px solid var(--primary);color:var(--primary)}
.market{background:var(--mercadolivre);color:var(--mercadolivre-foreground)}
.shopee{background:var(--shopee);color:var(--shopee-foreground)}
.product-select{border:0}.play{width:36px;min-width:36px;padding:0;cursor:pointer}.intro-actions .action{min-height:44px}

body { font-family: var(--font-body); letter-spacing: 0; }
.font-display { font-family: var(--font-display); }
.site-header { border-bottom: 1px solid var(--border); }
.header-inner { max-width: 1280px; margin: auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--primary); font-family: var(--font-display); font-size: 17px; text-decoration: none; white-space: nowrap; }
.brand img { width: 44px; height: 44px; object-fit: contain; }
.header-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav-link { padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted-foreground); transition: background .2s, color .2s; }
.nav-link:hover { background: var(--secondary); color: var(--foreground); }
.nav-link[data-status=active] { color: var(--primary); background: var(--secondary); }
.store-intro { max-width: 1280px; margin: auto; padding: 46px 24px 54px; text-align: center; }
.intro-logo { width: 174px; height: 174px; object-fit: contain; margin: 0 auto; }
.store-intro h1 { font-family: var(--font-display); font-size: 38px; margin-top: 24px; line-height: 1.5; }
.store-intro p { color: var(--muted-foreground); margin-top: 14px; font-size: 15px; }
.intro-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 28px; }
.store-content { max-width: 1280px; margin: auto; padding: 0 24px 64px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.section-heading h2 { font-family: var(--font-display); font-size: 21px; }
.product-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 16px; }
.product-card { position: relative; overflow: hidden; border-radius: 8px; border: 1px solid var(--border); background: var(--card); transition: border-color .2s, transform .2s, box-shadow .2s; }
.product-card:hover, .product-card:focus-within, .product-card.is-selected { z-index: 1; border-color: var(--primary); transform: scale(1.035); box-shadow: var(--product-highlight-shadow); }
.product-select.product-image { width: 100%; height: auto; padding: 0; border-radius: 0; cursor: pointer; }
.product-select.product-image > svg { width: 40px; height: 40px; }
.product-image { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--muted); color: var(--muted-foreground); }
.product-image > img { width: 100%; height: 100%; object-fit: contain; }
.product-info { padding: 14px; }
.product-info h3 { font-size: 14px; font-weight: 500; }
.product-price { margin-top: 6px; font-weight: 700; color: var(--primary); }
.product-links { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.market-icon { width: 22px; height: 16px; object-fit: contain; }
.shopee-icon { width: 20px; height: 20px; flex-shrink: 0; }
.carousel-rows { display: flex; flex-direction: column; gap: 32px; }
.slide-window { overflow: hidden; padding: 14px 10px 24px; margin: -14px -10px -24px; }
.slide-track { display: flex; width: max-content; }
.slide-group { display: flex; flex: 0 0 auto; gap: 16px; padding-right: 16px; animation: product-drift 420s linear infinite; will-change: transform; }
.slide-group .product-card { width: 224px; flex-shrink: 0; }
.slide-track.is-paused .slide-group { animation-play-state: paused; }
.slide-track.is-reversed .slide-group { animation-direction: reverse; }
@keyframes product-drift { from { transform: translateX(0); } to { transform: translateX(-100%); } }
.site-footer { padding: 28px 24px; border-top: 1px solid var(--border); text-align: center; color: var(--muted-foreground); font-size: 13px; }
.empty-category { padding: 80px 0; text-align: center; color: var(--muted-foreground); border-top: 1px solid var(--border); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--ring); outline-offset: 4px; }
@media(max-width: 1050px) { .header-inner { flex-direction: column; gap: 14px; } .product-grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }
@media(max-width: 600px) { .header-inner { padding: 16px; } .header-nav { justify-content: center; gap: 2px; } .nav-link { padding: 9px 10px; font-size: 12px; } .store-intro { padding: 32px 16px 40px; } .intro-logo { width: 140px; height: 140px; } .store-intro h1 { font-size: 23px; } .store-content { padding: 0 16px 40px; } .section-heading h2 { font-size: 17px; } .product-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .slide-group .product-card { width: 200px; } }
@media(prefers-reduced-motion: reduce) { .slide-group { animation: none; will-change: auto; } .slide-window { overflow-x: auto; } .product-card { transition: none; } .product-card:hover, .product-card:focus-within, .product-card.is-selected { transform: none; } }
@media(prefers-reduced-motion: reduce) { .slide-track.is-motion-enabled .slide-group { animation: product-drift 420s linear infinite; will-change: transform; } .slide-track.is-motion-enabled.is-paused .slide-group { animation-play-state: paused; } }
@media(prefers-reduced-motion: reduce) { .slide-track.is-motion-enabled.is-reversed .slide-group { animation-direction: reverse; } }
</style></head>

function market(label, href, cls, inner) {
  return linkValido(href)
    ? `<a class="action ${cls}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}${label}</a>`
    : `<button class="action ${cls}" disabled title="Link de compra ainda não configurado">${inner}${label}</button>`;
}

function card(p, selectable) {
  const img = p.imagem ? `<img src="${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy">`
    : `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>`;
  return `<article class="product-card${selected === p.id ? " is-selected" : ""}" data-id="${p.id}">
    ${selectable ? `<button class="product-select product-image" aria-label="Selecionar ${esc(p.nome)}" aria-pressed="${selected === p.id}">${img}</button>` : `<div class="product-image">${img}</div>`}

      <div class="product-links">
        ${market("Mercado Livre", p.mercadolivre, "market", `<img class="market-icon" src="${ML}" alt="">`)}
        ${market("Shopee", p.shopee, "shopee", SHOPEE_SVG)}
      </div></div></article>`;
}

function state() {
  document.querySelectorAll(".slide-track").forEach(t => {
    t.classList.toggle("is-paused", selected !== null);
    t.classList.toggle("is-motion-enabled", enabled);
  });
  document.querySelectorAll(".product-card").forEach(el => {
    const on = Number(el.dataset.id) === selected;
    el.classList.toggle("is-selected", on);
    el.querySelector(".product-select")?.setAttribute("aria-pressed", String(on));
  });
  const heading = document.querySelector(".section-heading");
  const play = heading.querySelector(".play");
  const wanted = selected !== null || (reduced.matches && !enabled);
  if (wanted && !play) {
    heading.insertAdjacentHTML("beforeend", `<button class="action play" aria-label="Reproduzir demonstração" title="Reproduzir demonstração">${PLAY_SVG}</button>`);
    heading.querySelector(".play").addEventListener("click", () => { selected = null; enabled = true; state(); });
  } else if (!wanted && play) play.remove();
}

function render() {
  const pagina = PAGINAS[location.hash.slice(1)] ? location.hash.slice(1) : "home";
  const config = PAGINAS[pagina];
  const produtos = produtosDaPagina(pagina);
  const home = pagina === "home";
  const nav = Object.keys(PAGINAS).map(k => `<a class="nav-link" data-status="${k === pagina ? "active" : ""}" href="${LINKS_MENU[k]}">${esc(PAGINAS[k].menu)}</a>`).join("");
  const contato = linkValido(LINKS_TOPO.contato)
    ? `<a class="action" href="${esc(LINKS_TOPO.contato)}" target="_blank" rel="noopener noreferrer">Fale conosco</a>`
    : `<button class="action" disabled title="Link de contato ainda não configurado">Fale conosco</button>`;
  const catalogo = linkValido(LINKS_TOPO.catalogo)
    ? `<a class="action outline" href="${esc(LINKS_TOPO.catalogo)}" target="_blank" rel="noopener noreferrer">Visite nosso catálogo</a>`
    : `<a class="action outline" href="#produtos">Visite nosso catálogo</a>`;
  const rows = home
    ? `<div class="carousel-rows">${CARROSSEIS_HOME.map((d, i) => `<div class="slide-window" role="region" aria-label="Demonstração de produtos ${i + 1}"><div class="slide-track${d === "direita" ? " is-reversed" : ""}${selected !== null ? " is-paused" : ""}${enabled ? " is-motion-enabled" : ""}">${[0, 1].map(() => `<div class="slide-group">${produtos.map(p => card(p, true)).join("")}</div>`).join("")}</div></div>`).join("")}</div>`
    : produtos.length ? `<div class="product-grid">${produtos.map(p => card(p, false)).join("")}</div>`
    : `<div class="empty-category">Nenhum produto nesta categoria no momento.</div>`;

  document.getElementById("app").innerHTML = `<header class="site-header"><div class="header-inner">
      <a class="brand" href="#home"><img id="brand-logo" src="" alt="">VERTICE IMPORTS</a>
      <nav class="header-nav" aria-label="Menu principal">${nav}</nav></div></header>
    <section class="store-intro">${home ? `<img class="intro-logo" src="${LOGO}" alt="Vertice Imports">` : ""}
      <h1>${esc(config.titulo)}</h1>${config.descricao ? `<p>${esc(config.descricao)}</p>` : ""}
      ${home ? `<div class="intro-actions">${contato}${catalogo}</div>` : ""}</section>
    <main class="store-content" id="produtos"><div class="section-heading"><h2>PRODUTOS</h2></div>${rows}</main>
    <footer class="site-footer">© 2026 Vertice Imports</footer>`;

  document.querySelector("#brand-logo").src = LOGO;
  if (home) {
    document.querySelectorAll(".product-card").forEach(el => el.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      const id = Number(el.dataset.id);
      selected = selected === id ? null : id;
      state();
    }));
  }
  state();
}

addEventListener("hashchange", () => {
  if (location.hash === "#produtos") { document.querySelector("#produtos")?.scrollIntoView(); return; }
  render(); scrollTo(0, 0);
});
reduced.addEventListener("change", () => state());
render();
</script></body></html>
